<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Shop</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="../assets/logo.jpeg" type="image/png" />
  </head>
  <body>
    <header id="header"></header>

    <main class="main">
        <h1>Faça o seu login para continuar</h1>
        <form id="form">
        <div class="div-form">
          <label for="email">E-mail</label>
          <input type="email" name="email" id="email" />
        </div>
        <div class="div-form">
          <label for="senha">Senha</label>
          <input type="password" name="senha" id="senha" />
        </div>
        <button type="button" onclick="fazerLogin()">Entrar</button>
      </form>
    </main>
    <script src="scripts/carregarComponentes.js"></script>
    <script src="scripts/login.js"></script>
  </body>
</html>
